<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cerveau Studio – Authorization</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px;
         line-height: 1.6; color: #1a1a1a; background: #fff; }
  .box { border: 1px solid #ddd; border-radius: 8px; padding: 16px; word-break: break-all;
         background: #f7f7f7; font-family: ui-monospace, monospace; font-size: .9rem; }
  button { margin-top: 12px; padding: 10px 18px; border: 0; border-radius: 6px;
           background: #fe2c55; color: #fff; font-size: 1rem; cursor: pointer; }
  .err { color: #c62828; }
</style>
</head>
<body>
<h1>Cerveau Studio</h1>
<div id="ok" hidden>
  <p>✅ TikTok authorization received. Copy this page address and paste it into the
     Cerveau Studio terminal to finish connecting your account.</p>
  <div class="box" id="url"></div>
  <button id="copy">Copy address</button>
</div>
<p id="error" class="err" hidden></p>
<script>
  const params = new URLSearchParams(location.search);
  // Transmet automatiquement le retour à l'outil Cerveau Studio qui tourne sur ce PC
  fetch("http://127.0.0.1:53682/" + location.search, {targetAddressSpace: "loopback"})
    .then(() => {
      const p = document.createElement("p");
      p.textContent = "✅ Sent to Cerveau Studio automatically — you can close this page.";
      document.body.appendChild(p);
    })
    .catch(() => {});
  if (params.get("code")) {
    document.getElementById("ok").hidden = false;
    document.getElementById("url").textContent = location.href;
    document.getElementById("copy").onclick = async () => {
      try { await navigator.clipboard.writeText(location.href); } catch (e) {}
      document.getElementById("copy").textContent = "Copied ✓";
    };
  } else {
    const e = document.getElementById("error");
    e.hidden = false;
    e.textContent = "Authorization was not completed: " +
      (params.get("error_description") || params.get("error") || "no code received") + ".";
  }
</script>
</body>
</html>
